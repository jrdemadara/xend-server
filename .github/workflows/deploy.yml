name: Deploy Xend Server

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux binaries
        run: |
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o dist/xend-api ./cmd/api

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o dist/xend-worker ./cmd/worker

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::876913699296:role/GitHubXendDeployRole
          aws-region: ap-southeast-1

      - name: Upload release to S3
        run: |
          aws s3 cp dist/xend-api \
            "s3://amzn-s3-xend-bucket-876913699296-ap-southeast-1-an/deploy/releases/${GITHUB_REF_NAME}/xend-api"
          aws s3 cp dist/xend-worker \
            "s3://amzn-s3-xend-bucket-876913699296-ap-southeast-1-an/deploy/releases/${GITHUB_REF_NAME}/xend-worker"

      - name: Deploy release to EC2
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-03458cf7c6fb9e466" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"/opt/xend/scripts/deploy.sh ${GITHUB_REF_NAME}\"]" \
            --region ap-southeast-1 \
            --query "Command.CommandId" \
            --output text)
          echo "SSM command: ${COMMAND_ID}"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "i-03458cf7c6fb9e466" \
            --region ap-southeast-1
      - name: Show deployment result
        if: always() && steps.deploy.outputs.command_id != ''
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-03458cf7c6fb9e466" \
            --region ap-southeast-1 \
            --query '{
              Status:Status,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }'
