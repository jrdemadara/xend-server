name: Deploy Xend Server

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux binaries
        run: |
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o dist/xend-api ./cmd/api

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o dist/xend-realtime ./cmd/realtime

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o dist/xend-worker ./cmd/worker

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::876913699296:role/GitHubXendDeployRole
          aws-region: ap-southeast-1

      - name: Upload release to S3
        run: |
          aws s3 cp dist/xend-api \
            "s3://amzn-s3-xend-bucket/deploy/releases/${GITHUB_REF_NAME}/xend-api"
          aws s3 cp dist/xend-realtime \
            "s3://amzn-s3-xend-bucket/deploy/releases/${GITHUB_REF_NAME}/xend-realtime"
          aws s3 cp dist/xend-worker \
            "s3://amzn-s3-xend-bucket/deploy/releases/${GITHUB_REF_NAME}/xend-worker"
